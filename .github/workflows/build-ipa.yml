name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build .app
        run: |
          xcodebuild \
            -project UnicornStore.xcodeproj \
            -scheme UnicornStore \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app into IPA
        run: |
          mkdir -p Payload
          cp -r Build/Build/Products/Release-iphoneos/UnicornStore.app Payload/
          zip -r UnicornStore.ipa Payload/
          rm -rf Payload

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnicornStore-IPA
          path: UnicornStore.ipa
          compression-level: 0

      - name: Upload .app as artifact (备用)
        uses: actions/upload-artifact@v4
        with:
          name: UnicornStore-App
          path: Build/Build/Products/Release-iphoneos/UnicornStore.app
          compression-level: 0

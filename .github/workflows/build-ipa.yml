name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build .app
        run: |
          xcodebuild -project UnicornStore.xcodeproj -scheme UnicornStore \
            -sdk iphoneos -configuration Release -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r Build/Build/Products/Release-iphoneos/UnicornStore.app Payload/
          zip -r UnicornStore.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnicornStore-IPA
          path: UnicornStore.ipa
          compression-level: 0

      - name: Upload build log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          compression-level: 0

      - name: Show compilation errors
        if: failure()
        run: |
          grep -n "error:" build.log | head -30 | \
            while IFS= read -r line; do echo "::error::$line"; done
          tail -30 build.log

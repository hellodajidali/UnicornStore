name: UnicornStore
options:
  bundleIdPrefix: com.unicornstore
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "14.0"

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  UnicornStore:
    type: application
    platform: iOS
    sources:
      - path: UnicornStore
    settings:
      base:
        INFOPLIST_FILE: UnicornStore/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.unicornstore.app
        PRODUCT_NAME: UnicornStore
    info:
      path: UnicornStore/Info.plist

name: ChuanLink
options:
  bundleIdPrefix: com.hellodajidali
  deploymentTarget:
    iOS: "14.0"

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  ChuanLink:
    type: application
    platform: iOS
    sources:
      - path: ChuanLink
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: ChuanLink/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hellodajidali.chuanlink
        PRODUCT_NAME: ChuanLink
